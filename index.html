.gesture .swipe::before, .gesture .swipe::after { content: ''; position: absolute; top: 50%; width: 5px; height: 5px; margin-top: -3px; border-top: 1.5px solid rgba(242,169,0,.7); border-right: 1.5px solid rgba(242,169,0,.7); }

/* 鼠标悬停器材：金边勾出模型轮廓，旁边给型号与单价 */
.gear-tip { --tx: 16px; --ty: 12px; position: absolute; z-index: 14; left: 0; top: 0; pointer-events: none; display: flex; flex-direction: column; gap: 2px; padding: 7px 11px 8px; border-radius: 9px; background: rgba(10,10,11,.84); border: 1px solid rgba(242,169,0,.3); border-left: 2px solid var(--accent); box-shadow: 0 10px 28px rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.96); transition: opacity .14s, transform .14s; white-space: nowrap; }
.gear-tip.on { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1); }
.gear-tip.flip { --tx: calc(-100% - 16px); }
.gear-tip.up { --ty: calc(-100% - 12px); }

.ev-cases figcaption { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; padding: 2px 6px; background: linear-gradient(0deg, rgba(0,0,0,.8), transparent); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.case-note { margin: 6px 12px 12px; font-size: 11px; color: var(--muted); }
.contact { display: flex; gap: 12px; align-items: center; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line-2); background: #141516; }
.contact img { width: 96px; height: 96px; display: block; background: #fff; }
.contact .c-list { flex: 1; min-width: 0; }
.contact .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 3px 0; color: var(--muted); }
.contact .row b { color: var(--fg); font-weight: 600; }
.gallery figcaption { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; padding: 2px 6px; background: linear-gradient(0deg, rgba(0,0,0,.7), transparent); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gallery p { grid-column: 1 / -1; margin: 0; font-size: 11px; color: var(--muted); }

.grp-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.grp-h em { font-style: normal; font-weight: 400; letter-spacing: 0; font-size: 11.5px; }
.card { --rc: var(--r-base); display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--rc); padding: 6px 10px 6px 6px; transition: transform .12s; }
.card[data-r="adv"] { --rc: var(--r-adv); } .card[data-r="pro"] { --rc: var(--r-pro); } .card[data-r="top"] { --rc: var(--r-top); }
.card[aria-pressed="true"] { background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 20%, var(--panel-2)), var(--panel-2)); border-color: color-mix(in srgb, var(--rc) 60%, transparent); border-left-color: var(--rc); }
.card[aria-disabled="true"] { cursor: default; }
.thumb { width: 56px; height: 56px; background: radial-gradient(circle at 50% 45%, #3a3c3f, #18191a 75%); display: grid; place-items: center; overflow: hidden; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.card[aria-pressed="true"] .thumb::after { content: "✓"; position: absolute; right: 0; top: 0; width: 16px; height: 16px; background: var(--rc); color: #111; font-size: 11px; font-weight: 900; display: grid; place-items: center; }
.c-name { font-weight: 700; font-size: 14px; line-height: 1.3; }
.c-model { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.c-tag { font-size: 10.5px; font-weight: 700; color: var(--rc); margin-right: 5px; }
.c-price { text-align: right; white-space: nowrap; font-family: var(--f-num); font-weight: 700; font-size: 17px; }
.c-price small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 11px; color: var(--muted); }
.card[aria-pressed="true"] .c-price small { color: var(--rc); }
.c-warn { display: block; color: var(--warn); font-size: 11px; }

/* summary */
.pw { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; }
.pw .grade { width: 52px; height: 52px; font-size: 30px; }
.pw strong { font-family: var(--f-num); font-size: 32px; line-height: 1; font-weight: 700; }
.pw small { display: block; color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.st { display: grid; grid-template-columns: 30px minmax(0,1fr) 24px; gap: 6px; align-items: center; font-size: 12px; }
.st i { height: 5px; background: rgba(255,255,255,.08); position: relative; }
.st i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: var(--fg); }
.st span:last-child { font-family: var(--f-num); text-align: right; font-weight: 600; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; }
.slot { aspect-ratio: 1; background: radial-gradient(circle at 50% 45%, #333538, #18191a 80%); border: 1px solid var(--line); border-bottom: 2px solid var(--rc, var(--r-base)); }
.slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.slot.empty { border-style: dashed; background: transparent; border-bottom: 1px dashed var(--line); }
.sample-frame { position: relative; background: #000; border: 1px solid var(--line); }
.sample-frame canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; }
.sample-frame span { position: absolute; right: 6px; top: 6px; font-size: 10.5px; background: rgba(0,0,0,.55); padding: 0 6px; color: #ddd; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags span { font-size: 12px; border: 1px solid var(--line-2); padding: 0 7px; }
.tags span.hi { border-color: var(--accent); color: var(--accent); }
.deliv, .promise { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.deliv li, .promise li { display: flex; gap: 8px; }
.deliv li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 7px; background: var(--accent); }
.promise li::before { content: "✓"; flex: none; color: var(--good); font-weight: 700; }
.order { border: 1px solid var(--line); background: var(--panel-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.row { display: flex; justify-content: space-between; gap: 10px; }
.row span:first-child { min-width: 0; color: var(--muted); }
.row span:last-child { font-family: var(--f-num); font-size: 15px; white-space: nowrap; }
.row.main span:first-child { color: var(--fg); }
.row.disc span { color: var(--good) !important; }
.row.free span:last-child s { color: var(--muted); margin-right: 6px; }
.row.free span:last-child b { color: var(--good); font-family: var(--f-body); font-size: 12px; }
.sub { border-top: 1px dashed var(--line-2); margin-top: 5px; padding-top: 5px; font-size: 11.5px; color: var(--muted); letter-spacing: .1em; }
.row.total { border-top: 1px solid var(--line-2); margin-top: 6px; padding-top: 8px; }
.row.total span:first-child { color: var(--fg); font-weight: 700; }
.row.total span:last-child { font-size: 26px; font-weight: 700; color: var(--accent); }
.saving { background: rgba(141,185,111,.12); border: 1px solid rgba(141,185,111,.4); padding: 6px 10px; font-size: 12.5px; color: var(--good); }
.saving b { font-family: var(--f-num); font-size: 16px; }
.nudge { border: 1px dashed var(--accent); color: var(--accent); padding: 6px 10px; font-size: 12.5px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.actions button { padding: 11px; border: 1px solid var(--line-2); background: var(--panel-2); font-weight: 700; }
.actions .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* dock */
.dock { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; background: #0b0b0c; border-top: 1px solid var(--line-2); padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.back { width: 44px; height: 44px; border: 1px solid var(--line-2); background: transparent; display: grid; place-items: center; padding: 0; }
.back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.back:disabled { opacity: .3; }
.price small { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; }
.price small s { font-family: var(--f-num); margin-left: 4px; }
.price small em { font-style: normal; color: var(--good); margin-left: 4px; }
.price strong { font-family: var(--f-num); font-size: 28px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.next { height: 44px; min-width: 120px; padding: 0 16px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 15px; letter-spacing: .06em; }
.next.ghost { background: var(--panel-3); color: var(--fg); }
.next:disabled { background: var(--panel-3); color: var(--muted); }

/* splash */
/* 开场未点击前，只留 3D 场景和封面，配置面板与底栏不露出（避免半透明封面下文字重叠） */
body:not(.started) .sheet, body:not(.started) .dock, body:not(.started) .hud { visibility: hidden; }
.splash { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(180deg, rgba(11,11,12,.35) 0%, rgba(11,11,12,.55) 40%, rgba(11,11,12,.97) 72%); padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); transition: opacity .5s, transform .5s; }
.splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.splash .eb { font-family: var(--f-num); letter-spacing: .3em; color: var(--accent); font-size: 13px; font-weight: 700; }
.splash h1 { margin: 6px 0 8px; font-size: clamp(34px, 10vw, 56px); font-weight: 900; letter-spacing: .08em; line-height: 1.05; text-wrap: balance; }
.splash p { margin: 0 0 18px; color: #c9c6be; font-size: 14px; max-width: 30em; line-height: 1.7; }
.splash .go { height: 54px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 900; letter-spacing: .14em; width: 100%; max-width: 420px; animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 6px rgba(242,169,0,.18); } }
.splash .quiet { margin-top: 10px; background: transparent; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; padding: 4px 0; }
/* 资源没齐之前不给进：客户第一眼就该是完整的 */
.splash .go[disabled] { animation: none; color: #a7a49c; cursor: default; background-color: #2b2b2d; background-image: linear-gradient(90deg, rgba(242,169,0,.26), rgba(242,169,0,.4)); background-repeat: no-repeat; background-size: var(--p, 0%) 100%; }
.splash .quiet[disabled] { opacity: .45; pointer-events: none; }
.splash .tip { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
#splashLoad { position: relative; padding-left: 11px; }
#splashLoad::before { content: ''; position: absolute; left: 0; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--accent); animation: dotPulse 1.15s ease-in-out infinite; }
#splashLoad.ready { color: #8db96f; }
#splashLoad.ready::before { animation: none; background: #8db96f; }
@keyframes dotPulse { 0%, 100% { opacity: .3; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.15); } }

.toast { position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 7px 14px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.82); display: grid; place-items: center; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal-box { background: var(--panel); border: 1px solid var(--line-2); padding: 14px; max-width: 460px; width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.modal-box img, .modal-box canvas { width: 100%; display: block; }
.modal-box p { margin: 0; color: var(--muted); font-size: 12.5px; }
.modal-box textarea { width: 100%; min-height: 260px; background: var(--bg); color: var(--fg); border: 1px solid var(--line-2); padding: 10px; font: 12.5px/1.6 var(--f-body); resize: vertical; }
.photo-ph { aspect-ratio: 3 / 4; border: 1px dashed var(--line-2); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }

/* mode switch, quantities, quote table */
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line-2); }
.seg button { background: transparent; border: 0; padding: 9px 6px; font-weight: 700; font-size: 14px; color: var(--muted); line-height: 1.3; }
.seg button small { display: block; font-weight: 400; font-size: 11px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; font-family: var(--f-num); font-size: 20px; font-weight: 700; min-width: 66px; }
.chip-btn small { font-family: var(--f-body); font-size: 11px; font-weight: 400; margin-left: 2px; }
.chip-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(242,169,0,.1); }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); padding: 10px 12px; }
.tog i { flex: none; width: 42px; height: 24px; border-radius: 12px; background: var(--panel-3); position: relative; transition: background .2s; }
.tog i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
.tog[aria-pressed="true"] i { background: var(--accent); }
.tog[aria-pressed="true"] i::after { transform: translateX(18px); background: var(--accent-ink); }
.tog small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
.card.has-qty { grid-template-columns: 56px minmax(0,1fr); cursor: pointer; }
.card[data-on="true"] { background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 20%, var(--panel-2)), var(--panel-2)); border-color: color-mix(in srgb, var(--rc) 60%, transparent); border-left-color: var(--rc); }
.card[data-on="true"] .thumb::after { content: attr(data-n); position: absolute; right: 0; top: 0; min-width: 18px; height: 18px; padding: 0 3px; background: var(--rc); color: #111; font-size: 12px; font-weight: 900; display: grid; place-items: center; font-family: var(--f-num); }
.c-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.c-foot .c-price { text-align: left; white-space: normal; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); flex: none; }
.qty button { width: 36px; height: 34px; background: transparent; border: 0; font-size: 20px; font-weight: 700; line-height: 1; }
.qty button:disabled { opacity: .25; }
.qty b { min-width: 24px; text-align: center; font-family: var(--f-num); font-size: 19px; }
.en { color: var(--muted); font-family: var(--f-num); font-size: 12.5px; font-weight: 500; }
.incl { display: flex; flex-wrap: wrap; gap: 4px; }
.incl span { font-size: 12px; border: 1px solid rgba(141,185,111,.45); color: var(--good); padding: 0 7px; }
.qt { border: 1px solid var(--line); background: var(--panel-2); }
.qt-row { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); align-items: baseline; font-size: 13px; }
.qt-row .no { font-family: var(--f-num); color: var(--muted); font-size: 12px; }
.qt-row small { display: block; color: var(--muted); font-size: 11.5px; }
.qt-row .amt { font-family: var(--f-num); font-size: 16px; font-weight: 700; text-align: right; white-space: nowrap; }
.qt-sum { padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
.upper { font-size: 12px; color: var(--muted); }
.day { display: grid; grid-template-columns: 58px minmax(0,1fr) auto; gap: 8px; font-size: 12.5px; padding: 6px 10px; background: var(--panel-2); border: 1px solid var(--line); }
.day b { font-family: var(--f-num); font-size: 14px; }
.day em { font-style: normal; color: var(--muted); }
.ref { font-size: 11.5px; color: var(--muted); }

@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) 440px; grid-template-rows: auto minmax(0, 1fr) auto; }
  .top { grid-column: 1 / -1; }
  .stage { grid-row: 2 / 4; grid-column: 1; }
  .sheet { grid-row: 2; grid-column: 2; border-top: 0; border-left: 1px solid var(--line); }
  .dock { grid-row: 3; grid-column: 2; border-left: 1px solid var(--line); }
  .mini { width: 180px; }
  .power strong { font-size: 46px; }
  .grade { width: 44px; height: 44px; font-size: 26px; }
  .load { right: auto; width: 300px; }
  /* 桌面开场只盖舞台那一列，右栏补一块品牌底，别让 440px 整片纯黑 */
  /* 桌面：文案压在左下，避开画面中央的摄影师；右栏补一块品牌底 */
  .splash { right: 440px; justify-content: flex-end; align-items: flex-start; text-align: left; padding-left: clamp(48px, 6vw, 96px); padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: radial-gradient(ellipse at 35% 60%, rgba(11,11,12,.42), rgba(11,11,12,.9) 78%); }
  .splash .quiet { align-self: flex-start; }
  .splash .go { max-width: 380px; }
  .splash::after { content: '光感影视\A 桂林 · 旅拍与活动影像\A \A 从一个空白摄影师开始，\A 按步骤把器材和人配齐，\A 价格实时算好。'; white-space: pre; position: fixed; top: 0; right: 0; bottom: 0; width: 440px; padding: 38vh 40px 40px; box-sizing: border-box; background: linear-gradient(180deg, rgba(242,169,0,.05), transparent 38%), #111213; border-left: 1px solid var(--line); color: #7d7a72; font-size: 13px; line-height: 2.1; letter-spacing: .06em; }
}
@media (prefers-reduced-motion: reduce) {
  .stage.hit canvas#three, .flash.go, .sheet-body.enter, .splash .go { animation: none; }
  .float { animation-duration: 1.1s; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b id="brandName">光感影视</b><strong>拍摄配置器</strong></div>
    <span class="sp"></span>
    <button type="button" class="q-btn" id="qBtn" aria-label="切换画质">画质 中</button>
    <button type="button" class="icon-btn" id="musicBtn" aria-pressed="true" aria-label="背景音乐">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="off" d="M3 3l18 18"/></svg>
    </button>
    <button type="button" class="icon-btn" id="sfxBtn" aria-pressed="true" aria-label="音效">
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <canvas id="three" aria-label="3D 摄影师与装备"></canvas>
    <div class="hud" id="hud">
      <div class="flash" id="flash"></div>
      <div class="hud-tl"><div class="power"><small>配置评分</small><strong id="power">0</strong></div><div class="grade none" id="grade">—</div></div>
      <button type="button" class="mini" id="mini" aria-label="查看样片"><canvas id="miniCv" width="320" height="200"></canvas><div class="empty" id="miniEmpty">选好时长后<br>这里出样片</div><span>样片预览 · 点开</span></button>
      <div class="feed" id="feed"></div>
      <div class="fullmsg" id="fullmsg"><b>配置完成</b><span>拍摄团队已就位</span></div>
      <div class="load"><small><span>装备满载度</span><b id="loadTxt">0%</b></small><div class="bar"><i id="loadBar"></i></div></div>
      <div class="loading" id="loading"><span id="loadMsg">正在载入摄影师…</span><div class="lbar"><i id="loadPct"></i></div><button type="button" id="retryBtn" hidden>重新加载人物</button></div>
      <div class="diag" id="diag" hidden></div>
    </div>
    <button type="button" class="fs-btn" id="fsBtn" aria-label="全屏查看人物" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="gear-tip" id="gearTip" aria-hidden="true"><b></b><span></span></div>
      <div class="gesture" id="gesture" aria-hidden="true">
      <div class="g"><span class="ico swipe"><i></i></span><b>左右拖动</b></div>
      <div class="g"><span class="ico pinch"><i></i><i></i></span><b>双指缩放</b></div>
    </div>
  </main>

  <section class="sheet" id="sheet" aria-live="polite">
    <div class="sheet-head">
      <div class="stepper" id="stepper"></div>
      <div class="step-title"><b id="stepNo">1 / 7</b><h2 id="stepTitle">拍多久</h2></div>
      <p class="step-hint" id="stepHint"></p>
    </div>
    <div class="sheet-body" id="body"></div>
  </section>

  <footer class="dock">
    <button type="button" class="back" id="backBtn" aria-label="上一步"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

function hairGroup(look) {
  const g = new THREE.Group(); g.name = 'look-hair';
  const hm = mat(look.hairColor, { roughness: .95, metalness: 0 });
  const cap = (theta, tilt, m = hm, s = [1.03, .93, 1.07], r = .109) => { const o = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 20, 0, Math.PI * 2, 0, Math.PI * theta), m); o.position.set(0, .108, .006); o.scale.set(...s); o.rotation.x = tilt; o.castShadow = true; return o; };
  if (look.hair === 'beanie') {
    g.add(cap(.56, -.42));
    const rim = new THREE.Mesh(new THREE.TorusGeometry(.104, .012, 10, 40), hm); rim.position.set(0, .118, -.02); rim.rotation.x = Math.PI / 2 - .42 + .0; rim.scale.set(1.06, 1.12, 1); g.add(rim);
  } else if (look.hair === 'cap') {
    const cm = mat(0x23262a, { roughness: .9, metalness: 0 });
    g.add(cap(.5, -.75, hm, [1.04, .95, 1.08], .107));
    g.add(cap(.42, -.12, cm, [1.06, .92, 1.1], .112));
    const brim = cyl(.085, .085, .008, cm, 32); brim.scale.set(1, 1, 1.1); brim.position.set(0, .14, .115); brim.rotation.x = .18; g.add(brim);
    g.add(at(box(.03, .012, .004, M.orange), 0, .19, .095, -.6));
  } else {
    g.add(cap(.5, -.55, hm, [1.04, .95, 1.08], .108));
    if (look.hair === 'long') { const tail = cyl(.032, .012, .22, hm, 16); tail.position.set(0, .03, -.13); tail.rotation.x = -.35; g.add(tail, at(new THREE.Mesh(new THREE.TorusGeometry(.03, .008, 8, 20), M.black), 0, .125, -.105, -.35 + Math.PI / 2)); }
    if (look.hair === 'bun') g.add(at(sph(.045, hm), 0, .19, -.07));
  }
  return g;
}
function applyLook(model, look) {
  const head = model.getObjectByName('Head'); if (!head) return;
  const old = head.getObjectByName('look-hair'); if (old) head.remove(old);
  head.add(hairGroup(look));
  model.traverse(o => { if (o.isMesh && (o.name === 'Wolf3D_Head' || o.name === 'Wolf3D_Body')) o.material.color.set(look.skin); });
}
function softPerson(src, look, top, bottom) {
  const g = SkeletonUtils.clone(src);
  g.traverse(o => {
    if (o.isMesh) o.material = o.material.clone();
    if (o.isMesh && o.name === 'Wolf3D_Outfit_Top') o.material.color.set(top);
    if (o.isMesh && o.name === 'Wolf3D_Outfit_Bottom') o.material.color.set(bottom);
  });
  applyLook(g, look); return g;
}

}
$('retryBtn').onclick = () => { Snd.tap(); loadPerson().then(ok => { if (ok) { thumbs = makeThumbs(); renderStep(); toast('摄影师已就位'); } }); };

/* 全屏只看人物：优先浏览器全屏，iOS 微信没有这个 API 就用 CSS 铺满 */
const ICON_FS = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_EXIT = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 9V4M9 9H4M15 9V4M15 9h5M15 15v5M15 15h5M9 15v5M9 15H4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function setFullUI(on) {
  document.body.classList.toggle('stage-full', on);
  const b = $('fsBtn');
  b.setAttribute('aria-pressed', on);
  b.setAttribute('aria-label', on ? '退出全屏' : '全屏查看人物');
  b.innerHTML = on ? ICON_EXIT : ICON_FS;
  setTimeout(resize, 80);
}
async function toggleFull() {
  const on = !document.body.classList.contains('stage-full');
  setFullUI(on);
  try {
    if (on) { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); }
    else if (document.fullscreenElement) await document.exitFullscreen();
  } catch (err) { /* 微信/iOS 不支持全屏 API，CSS 已经铺满，忽略 */ }
}
$('fsBtn').onclick = () => { Snd.tap(); toggleFull(); };
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('stage-full')) setFullUI(false);
});
async function boot(data = {}) {
  await loadPerson();
  try { thumbs = makeThumbs(); } catch (err) { reportErr('缩略图生成失败', err); }
  renderStep();
  if (data.mode === 'event' && data.ev?.days) {
    started = true; document.body.classList.add('started'); $('splash').hidden = true; fig.visible = true; setMode('event', true);
    Object.assign(state.ev, { days: data.ev.days, reh: data.ev.reh, tax: data.ev.tax }); syncEvFree(true);
    for (const [id, n] of Object.entries(data.ev.q || {})) setQty(id, n, true);
    state.step = data.step || 0; state.visited = STEPS_EVENT.length - 1; renderStep(); readyToStart(); return;
  }
  if (data.dur) {     // 页面热更新时恢复刚才的配置
    started = true; document.body.classList.add('started'); $('splash').hidden = true; fig.visible = true;
    applyPreset({ ...data, items: data.items || [] }, { quiet: true }); state.step = data.step || 0; state.visited = steps().length - 1; renderStep();
  }
  readyToStart();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
