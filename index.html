<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摄影师装备舱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: phone first. Top bar, live 3D photographer (always visible), guided step sheet that scrolls, fixed dock with price and next. On wide screens the stage moves left and the sheet becomes a 440px column. */
:root {
  --bg: #0f1011;
  --panel: #151617;
  --panel-2: #1d1e20;
  --panel-3: #26282a;
  --line: rgba(232, 229, 220, .10);
  --line-2: rgba(232, 229, 220, .22);
  --fg: #e8e5dc;
  --muted: #8f8c84;
  --accent: #f2a900;
  --accent-ink: #171100;
  --good: #8db96f;
  --warn: #d9822b;
  --r-base: #a8a59c;
  --r-adv: #5aa0d8;
  --r-pro: #a57ad8;
  --r-top: #f2a900;
  --f-num: "Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.5; margin: 0; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 47fr) minmax(0, 53fr) auto; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); background: #0b0b0c; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand b { font-family: var(--f-num); font-weight: 700; letter-spacing: .22em; font-size: 11px; color: var(--accent); }
.brand strong { font-size: 16px; font-weight: 900; letter-spacing: .1em; white-space: nowrap; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; background: transparent; border: 1px solid var(--line-2); padding: 0; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.icon-btn[aria-pressed="false"] .on, .icon-btn[aria-pressed="true"] .off { display: none; }
.top .sp { margin-left: auto; }

/* stage */
.stage { position: relative; overflow: hidden; background: #26282a; min-height: 0; }
.stage canvas#three { display: block; width: 100%; height: 100%; touch-action: none; }
.stage.hit canvas#three { animation: hit .26s cubic-bezier(.3,1.6,.5,1); }
@keyframes hit { 0% { transform: none; } 25% { transform: scale(1.03) translateY(5px); } 100% { transform: none; } }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud-tl { position: absolute; left: 12px; top: 10px; display: flex; gap: 8px; align-items: flex-end; }
.power small { display: block; font-size: 10px; letter-spacing: .24em; color: rgba(232,229,220,.75); }
.power strong { font-family: var(--f-num); font-size: 36px; font-weight: 700; line-height: .95; text-shadow: 0 2px 10px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
.grade { font-family: var(--f-num); font-weight: 700; font-size: 22px; line-height: 1; width: 36px; height: 36px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.grade.none { background: rgba(255,255,255,.12); color: var(--muted); }
.mini { position: absolute; right: 10px; top: 10px; width: 112px; pointer-events: auto; background: rgba(10,10,11,.7); border: 1px solid var(--line-2); padding: 3px; }
.mini canvas { display: block; width: 100%; aspect-ratio: 16 / 10; background: #000; }
.mini span { display: block; font-size: 10px; letter-spacing: .1em; color: var(--muted); padding: 2px 2px 0; }
.mini .empty { position: absolute; inset: 3px 3px 18px; display: grid; place-items: center; font-size: 10px; color: var(--muted); text-align: center; padding: 4px; }
.feed { position: absolute; left: 12px; top: 64px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; max-width: calc(100% - 140px); }
.feed div { background: rgba(10,10,11,.7); padding: 1px 8px; border-left: 2px solid var(--rc, var(--accent)); animation: feed 3s forwards; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed div b { font-family: var(--f-num); color: var(--rc, var(--accent)); margin-left: 6px; font-size: 13px; }
@keyframes feed { 0% { opacity: 0; transform: translateX(-10px); } 8%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.load { position: absolute; left: 12px; right: 12px; bottom: 10px; }
.load small { font-size: 10px; letter-spacing: .16em; color: rgba(232,229,220,.8); display: flex; justify-content: space-between; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.load small b { font-family: var(--f-num); font-size: 13px; color: var(--accent); }
.load .bar { height: 4px; background: rgba(255,255,255,.14); margin-top: 3px; position: relative; overflow: hidden; }
.load .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .45s cubic-bezier(.3,1.4,.5,1); }
.float { position: absolute; transform: translate(-50%, -50%); pointer-events: none; text-align: center; font-family: var(--f-num); font-weight: 700; font-size: 24px; line-height: 1; color: var(--rc, var(--accent)); text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 14px rgba(0,0,0,.5); animation: pop 1.1s cubic-bezier(.2,1.5,.4,1) forwards; white-space: nowrap; }
.float small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 700; color: #fff; margin-top: 2px; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 18% { transform: translate(-50%, -60%) scale(1.25); opacity: 1; } 35% { transform: translate(-50%, -62%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -110%) scale(1); opacity: 0; } }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.flash.go { animation: flash .28s ease-out; }
@keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }
.fullmsg { position: absolute; left: 50%; bottom: 34px; transform: translate(-50%, 0) scale(.6); text-align: center; opacity: 0; transition: opacity .3s, transform .45s cubic-bezier(.2,1.6,.4,1); }
.fullmsg.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
.fullmsg b { display: block; font-size: clamp(24px, 7vw, 40px); font-weight: 900; letter-spacing: .3em; color: var(--accent); text-shadow: 0 3px 0 #5a3f00, 0 0 24px rgba(0,0,0,.6); white-space: nowrap; }
.fullmsg span { font-size: 11px; letter-spacing: .3em; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; letter-spacing: .2em; color: var(--muted); }

/* sheet */
.sheet { background: var(--panel); border-top: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; min-height: 0; -webkit-overflow-scrolling: touch; }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--panel); padding-block: 10px 10px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.stepper { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.stepper button { height: 4px; border: 0; padding: 0; background: rgba(255,255,255,.12); position: relative; }
.stepper button::before { content: ""; position: absolute; inset: -10px 0; }
.stepper button.done { background: rgba(242,169,0,.55); }
.stepper button.cur { background: var(--accent); }
.step-title { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.step-title b { font-family: var(--f-num); color: var(--accent); font-size: 14px; letter-spacing: .08em; }
.step-title h2 { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: .06em; }
.step-hint { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.sheet-body { padding-block: 12px 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-body.enter { animation: enter .28s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

.h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.h h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
.h h3::before { content: ""; display: inline-block; width: 3px; height: 11px; background: var(--accent); margin-right: 7px; vertical-align: -1px; }
.h small { color: var(--muted); font-size: 12px; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.note { border: 1px solid rgba(141,185,111,.35); background: rgba(141,185,111,.07); padding: 10px 12px; font-size: 12.5px; line-height: 1.6; }
.note b { color: var(--good); }
.note ol { margin: 4px 0 0; padding-left: 18px; }

.opt { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 10px; text-align: left; width: 100%; background: var(--panel-2); border: 1px solid var(--line); padding: 11px 12px; position: relative; transition: transform .12s; }
.opt:active, .card:active, .pg-main:active { transform: scale(.985); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: linear-gradient(90deg, rgba(242,169,0,.14), rgba(242,169,0,.02)); }
.opt .t { font-weight: 700; font-size: 15px; }
.opt .p { font-family: var(--f-num); font-weight: 700; font-size: 22px; line-height: 1; text-align: right; }
.opt .d { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
.opt .d em { font-style: normal; color: var(--fg); }
.flag { position: absolute; top: -1px; right: -1px; font-size: 10.5px; font-weight: 700; padding: 1px 6px; background: var(--accent); color: var(--accent-ink); }
.flag.g { background: var(--good); color: #0e1508; }
.opt:has(.flag) .p { margin-top: 12px; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.presets button { text-align: left; background: var(--panel-2); border: 1px solid var(--line); padding: 8px 10px; }
.presets button b { display: block; font-size: 13.5px; }
.presets button span { font-family: var(--f-num); font-size: 16px; color: var(--accent); font-weight: 700; }
.presets button small { color: var(--muted); font-size: 11px; margin-left: 4px; }

.pg { background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; }
.pg[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.pg-main { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; padding: 10px 12px; width: 100%; transition: transform .12s; }
.lv { width: 48px; height: 48px; display: grid; place-items: center; background: var(--panel-3); border: 1px solid var(--line-2); font-family: var(--f-num); font-weight: 700; line-height: 1; text-align: center; }
.lv b { font-size: 20px; display: block; }
.lv small { font-size: 9.5px; letter-spacing: .1em; color: var(--muted); }
.pg[data-lv="2"] .lv { border-color: var(--r-adv); } .pg[data-lv="3"] .lv { border-color: var(--r-pro); } .pg[data-lv="4"] .lv { border-color: var(--r-top); color: var(--r-top); }
.pg-name { font-weight: 700; font-size: 15px; }
.pg-style { color: var(--muted); font-size: 12px; }
.pg-price { font-family: var(--f-num); font-weight: 700; font-size: 18px; text-align: right; white-space: nowrap; }
.pg-price small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 11px; color: var(--muted); }
.meta { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.meta div { padding: 5px 8px; border-right: 1px solid var(--line); min-width: 0; }
.meta div:last-child { border-right: 0; }
.meta small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .04em; }
.meta b { font-family: var(--f-num); font-size: 15px; font-weight: 600; }
.svc-tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 0 5px; border: 1px solid currentColor; line-height: 1.5; }
.svc-tag.hi { color: var(--good); } .svc-tag.mid { color: var(--warn); }
.pg-foot { display: flex; align-items: center; gap: 6px; padding: 6px 12px 9px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.pg-foot span { flex: 1; min-width: 0; }
.link { background: transparent; border: 1px solid var(--line-2); padding: 3px 9px; font-size: 12px; color: var(--fg); white-space: nowrap; }
.link:hover { border-color: var(--accent); color: var(--accent); }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 0 12px 12px; }
.gallery figure { margin: 0; position: relative; }
.gallery canvas { width: 100%; aspect-ratio: 3 / 2; display: block; background: #000; }
.gallery figcaption { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; padding: 2px 6px; background: linear-gradient(0deg, rgba(0,0,0,.7), transparent); color: #fff; }
.gallery p { grid-column: 1 / -1; margin: 0; font-size: 11px; color: var(--muted); }

.grp-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.grp-h em { font-style: normal; font-weight: 400; letter-spacing: 0; font-size: 11.5px; }
.card { --rc: var(--r-base); display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--rc); padding: 6px 10px 6px 6px; transition: transform .12s; }
.card[data-r="adv"] { --rc: var(--r-adv); } .card[data-r="pro"] { --rc: var(--r-pro); } .card[data-r="top"] { --rc: var(--r-top); }
.card[aria-pressed="true"] { background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 20%, var(--panel-2)), var(--panel-2)); border-color: color-mix(in srgb, var(--rc) 60%, transparent); border-left-color: var(--rc); }
.card[aria-disabled="true"] { cursor: default; }
.thumb { width: 56px; height: 56px; background: radial-gradient(circle at 50% 45%, #3a3c3f, #18191a 75%); display: grid; place-items: center; overflow: hidden; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.card[aria-pressed="true"] .thumb::after { content: "✓"; position: absolute; right: 0; top: 0; width: 16px; height: 16px; background: var(--rc); color: #111; font-size: 11px; font-weight: 900; display: grid; place-items: center; }
.c-name { font-weight: 700; font-size: 14px; line-height: 1.3; }
.c-model { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.c-tag { font-size: 10.5px; font-weight: 700; color: var(--rc); margin-right: 5px; }
.c-price { text-align: right; white-space: nowrap; font-family: var(--f-num); font-weight: 700; font-size: 17px; }
.c-price small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 11px; color: var(--muted); }
.card[aria-pressed="true"] .c-price small { color: var(--rc); }
.c-warn { display: block; color: var(--warn); font-size: 11px; }

/* summary */
.pw { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; }
.pw .grade { width: 52px; height: 52px; font-size: 30px; }
.pw strong { font-family: var(--f-num); font-size: 32px; line-height: 1; font-weight: 700; }
.pw small { display: block; color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.st { display: grid; grid-template-columns: 30px minmax(0,1fr) 24px; gap: 6px; align-items: center; font-size: 12px; }
.st i { height: 5px; background: rgba(255,255,255,.08); position: relative; }
.st i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: var(--fg); }
.st span:last-child { font-family: var(--f-num); text-align: right; font-weight: 600; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; }
.slot { aspect-ratio: 1; background: radial-gradient(circle at 50% 45%, #333538, #18191a 80%); border: 1px solid var(--line); border-bottom: 2px solid var(--rc, var(--r-base)); }
.slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.slot.empty { border-style: dashed; background: transparent; border-bottom: 1px dashed var(--line); }
.sample-frame { position: relative; background: #000; border: 1px solid var(--line); }
.sample-frame canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; }
.sample-frame span { position: absolute; right: 6px; top: 6px; font-size: 10.5px; background: rgba(0,0,0,.55); padding: 0 6px; color: #ddd; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags span { font-size: 12px; border: 1px solid var(--line-2); padding: 0 7px; }
.tags span.hi { border-color: var(--accent); color: var(--accent); }
.deliv, .promise { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.deliv li, .promise li { display: flex; gap: 8px; }
.deliv li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 7px; background: var(--accent); }
.promise li::before { content: "✓"; flex: none; color: var(--good); font-weight: 700; }
.order { border: 1px solid var(--line); background: var(--panel-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.row { display: flex; justify-content: space-between; gap: 10px; }
.row span:first-child { min-width: 0; color: var(--muted); }
.row span:last-child { font-family: var(--f-num); font-size: 15px; white-space: nowrap; }
.row.main span:first-child { color: var(--fg); }
.row.disc span { color: var(--good) !important; }
.row.free span:last-child s { color: var(--muted); margin-right: 6px; }
.row.free span:last-child b { color: var(--good); font-family: var(--f-body); font-size: 12px; }
.sub { border-top: 1px dashed var(--line-2); margin-top: 5px; padding-top: 5px; font-size: 11.5px; color: var(--muted); letter-spacing: .1em; }
.row.total { border-top: 1px solid var(--line-2); margin-top: 6px; padding-top: 8px; }
.row.total span:first-child { color: var(--fg); font-weight: 700; }
.row.total span:last-child { font-size: 26px; font-weight: 700; color: var(--accent); }
.saving { background: rgba(141,185,111,.12); border: 1px solid rgba(141,185,111,.4); padding: 6px 10px; font-size: 12.5px; color: var(--good); }
.saving b { font-family: var(--f-num); font-size: 16px; }
.nudge { border: 1px dashed var(--accent); color: var(--accent); padding: 6px 10px; font-size: 12.5px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.actions button { padding: 11px; border: 1px solid var(--line-2); background: var(--panel-2); font-weight: 700; }
.actions .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* dock */
.dock { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; background: #0b0b0c; border-top: 1px solid var(--line-2); padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.back { width: 44px; height: 44px; border: 1px solid var(--line-2); background: transparent; display: grid; place-items: center; padding: 0; }
.back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.back:disabled { opacity: .3; }
.price small { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; }
.price small s { font-family: var(--f-num); margin-left: 4px; }
.price small em { font-style: normal; color: var(--good); margin-left: 4px; }
.price strong { font-family: var(--f-num); font-size: 28px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.next { height: 44px; min-width: 120px; padding: 0 16px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 15px; letter-spacing: .06em; }
.next.ghost { background: var(--panel-3); color: var(--fg); }
.next:disabled { background: var(--panel-3); color: var(--muted); }

/* splash */
.splash { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(180deg, rgba(11,11,12,.35) 0%, rgba(11,11,12,.55) 40%, rgba(11,11,12,.97) 72%); padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); transition: opacity .5s, transform .5s; }
.splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.splash .eb { font-family: var(--f-num); letter-spacing: .3em; color: var(--accent); font-size: 13px; font-weight: 700; }

  renderer.render(scene, cam); const src = renderer.domElement, ar = 1080 / 900; let cw = src.width, ch = cw / ar; if (ch > src.height) { ch = src.height; cw = ch * ar; }
  x.drawImage(src, (src.width - cw) / 2, (src.height - ch) / 2, cw, ch, 0, 110, 1080, 900);
  x.fillStyle = '#f2a900'; x.font = '700 34px "Barlow Condensed", sans-serif'; x.fillText(BRAND, 56, 70);
  x.fillStyle = '#e8e5dc'; x.font = '900 34px "Noto Sans SC", sans-serif'; x.textAlign = 'right'; x.fillText(`${CITY} · 摄影师装备舱`, 1024, 70); x.textAlign = 'left';
  const gr = x.createLinearGradient(0, 820, 0, 1010); gr.addColorStop(0, 'rgba(15,16,17,0)'); gr.addColorStop(1, 'rgba(15,16,17,1)'); x.fillStyle = gr; x.fillRect(0, 820, 1080, 190);
  x.fillStyle = '#f2a900'; x.fillRect(56, 900, 96, 96); x.fillStyle = '#171100'; x.font = '700 64px "Barlow Condensed", sans-serif'; x.textAlign = 'center'; x.fillText(g, 104, 972); x.textAlign = 'left';
  x.fillStyle = '#e8e5dc'; x.font = '700 80px "Barlow Condensed", sans-serif'; x.fillText(String(pw), 176, 968); x.font = '28px "Noto Sans SC", sans-serif'; x.fillStyle = '#8f8c84'; x.fillText('战斗力 · ' + gt, 180, 1000);
  x.textAlign = 'right'; x.fillStyle = '#f2a900'; x.font = '700 72px "Barlow Condensed", sans-serif'; x.fillText(yuan(P.total), 1024, 968); x.fillStyle = '#8f8c84'; x.font = '26px "Noto Sans SC", sans-serif'; x.fillText(`${P.d.name} · LV.${P.p.lv} ${P.p.title}`, 1024, 1000); x.textAlign = 'left';
  const sc = document.createElement('canvas'); sc.width = 640; sc.height = 400; drawSample(sc, statsOf(state)); x.drawImage(sc, 56, 1040, 480, 300);
  x.fillStyle = '#e8e5dc'; x.font = '26px "Noto Sans SC", sans-serif'; let yy = 1060;
  deliverables(P).slice(0, 8).forEach(t => { x.fillText('· ' + (t.length > 18 ? t.slice(0, 17) + '…' : t), 570, yy + 20); yy += 38; });
  x.fillStyle = '#8db96f'; x.fillText(`免费包含价值 ${yuan(P.freeVal)} · 价格透明 · 下雨免费改期`, 56, 1400);

/* ---------- 声音开关 ---------- */
const syncSoundBtns = () => { $('sfxBtn').setAttribute('aria-pressed', Snd.sfxOn); $('musicBtn').setAttribute('aria-pressed', Snd.musicOn); };
$('sfxBtn').onclick = () => { Snd.init(); Snd.setSfx(!Snd.sfxOn); syncSoundBtns(); Snd.tap(); };
$('musicBtn').onclick = () => { Snd.init(); Snd.setMusic(!Snd.musicOn); syncSoundBtns(); };
syncSoundBtns();

/* ---------- 开场 ---------- */
function start(withSound) {
  if (started) return; started = true;
  Snd.init(); if (!withSound) { Snd.setSfx(false); Snd.setMusic(false); syncSoundBtns(); }
  $('splash').classList.add('out'); setTimeout(() => $('splash').hidden = true, 550);
  Snd.intro();
  setTimeout(() => {      // 空白摄影师落地
    fig.visible = true; fig.position.y = 1.2;
    const t0 = now(), drop = () => { const u = Math.min(1, (now() - t0) / .22); fig.position.y = 1.2 * (1 - u * u * u); if (u < 1) requestAnimationFrame(drop); else { shockwave(V(0, 0, 0), 0xf2a900, true, 2.8); puff(V(0, .05, 0), true); kick.set(0, -.14, 0); fovPunch = 6; stage.classList.remove('hit'); void stage.offsetWidth; stage.classList.add('hit'); buzz(30); } };
    drop();
  }, reduce ? 0 : 1000);
  setTimeout(() => { Snd.startMusic(); toast('第一步：选拍多久'); }, reduce ? 0 : 1700);
}
$('startBtn').onclick = () => start(true);
$('quietBtn').onclick = () => start(false);

/* ---------- 启动 ---------- */
$('brandName').textContent = BRAND; $('splashEb').textContent = `${BRAND} · ${CITY}`;
renderStep(); update(); tick(); loop();
// 模型可以是 .glb，也可以是把 glb 转成 base64 后 export default 的 .js（某些托管平台不支持 .glb）
async function loadModel() {
  if (!MODEL_URL.endsWith('.js')) return loader.loadAsync(MODEL_URL);
  const { default: b64 } = await import(new URL(MODEL_URL, document.baseURI).href);
  return loader.parseAsync(Uint8Array.from(atob(b64), ch => ch.charCodeAt(0)).buffer, '');
}
async function boot(data = {}) {
  try {
    const gltf = await loadModel();
    person = gltf.scene; prepPerson(person); personTemplate = SkeletonUtils.clone(person);
    applyLook(person, BLANK_LOOK); fig.add(person);
    for (const n of ['Hips', 'Spine', 'Spine1', 'Spine2', 'Head', 'RightHand', 'LeftHand']) { bones[n] = person.getObjectByName(n); baseQ[n] = bones[n]?.quaternion.clone(); }
    person.traverse(o => { if (o.isMesh && o.name === 'Wolf3D_Outfit_Top') outfitMat = o.material; });
    recalcHand();
  } catch (err) {
    console.warn('模型加载失败，改用简易人形', err);
    const m = mannequinFallback(); fig.add(m); bones = { Hips: m, Spine2: m, RightHand: m };
  }
  $('loading').hidden = true;
  thumbs = makeThumbs(); renderStep();
  if (data.dur) {     // 页面热更新时恢复刚才的配置
    started = true; $('splash').hidden = true; fig.visible = true;
    applyPreset({ ...data, items: data.items || [] }, { quiet: true }); state.step = data.step || 0; state.visited = STEPS.length - 1; renderStep();
  }
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
