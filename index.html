<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摄影师装备舱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: game loadout screen. Gear rack (left) · 3D stage with the photographer (center) · rank, sample shot and quote (right). Stacks to one column on phones. */
:root {
  --bg: #0a0c1c;
  --panel: #11142b;
  --panel-2: #181c3a;
  --line: #262b52;
  --fg: #eceaf7;
  --muted: #8d91b8;
  --accent: #ffb627;      /* legendary gold, the one loud colour */
  --accent-ink: #1b1300;
  --r-n: #9aa6bf;         /* 普通 */
  --r-r: #4fa3ff;         /* 稀有 */
  --r-sr: #b77bff;        /* 史诗 */
  --r-ssr: #ffb627;       /* 传说 */
  --good: #48d597;
  --f-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "Chakra Petch", "DIN Alternate", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.5; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100%;
  gap: 0;
}
@media (min-width: 1101px) { html, body { height: 100%; overflow: hidden; } }

/* ---------- top bar ---------- */
.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--f-num); font-weight: 700; letter-spacing: .18em; font-size: 13px; color: var(--accent); }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: .04em; }
.top-total { margin-left: auto; display: flex; align-items: baseline; gap: 10px; }
.top-total span { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
.top-total strong { font-family: var(--f-num); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }

/* ---------- panels ---------- */
.panel { background: var(--panel); overflow-y: auto; min-width: 0; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.panel-inner { display: flex; flex-direction: column; gap: 14px; padding-block: 14px; padding-inline: 14px; }
.eyebrow { font-size: 11px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-title h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0; letter-spacing: .04em; }
.sec-title small { color: var(--muted); font-size: 12px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.cat { display: flex; flex-direction: column; gap: 8px; }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700; padding-top: 4px; }
.cat-head em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; }
.card {
  --rc: var(--r-n);
  display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  text-align: left; width: 100%;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 10px 7px 7px; position: relative;
  transition: border-color .2s, transform .15s, box-shadow .2s;
}
.card:hover { border-color: var(--rc); transform: translateX(2px); }
.card[data-r="R"] { --rc: var(--r-r); } .card[data-r="SR"] { --rc: var(--r-sr); } .card[data-r="SSR"] { --rc: var(--r-ssr); }
.card[aria-pressed="true"] { border-color: var(--rc); box-shadow: 0 0 0 1px var(--rc) inset, 0 0 18px -6px var(--rc); background: color-mix(in srgb, var(--rc) 10%, var(--panel-2)); }
.thumb { width: 58px; height: 58px; border-radius: 8px; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 30%, transparent), transparent 70%), var(--bg); display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.card-name { font-weight: 700; font-size: 13.5px; line-height: 1.3; }
.card-model { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.rar { display: inline-block; font-family: var(--f-num); font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--rc); border: 1px solid var(--rc); border-radius: 4px; padding: 0 4px; margin-right: 6px; vertical-align: 1px; }
.card-price { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; white-space: nowrap; }
.card-price small { display: block; font-size: 10.5px; color: var(--muted); font-family: var(--f-body); font-weight: 400; }
.card[aria-pressed="true"] .card-price small { color: var(--rc); }

/* ---------- stage ---------- */
.stage { position: relative; min-width: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, #1c2050 0%, var(--bg) 70%); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; pointer-events: none; inset: 0; }
.hud-top { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.power { font-family: var(--f-num); }
.power span { display: block; font-size: 11px; letter-spacing: .2em; color: var(--muted); }
.power strong { font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 24px color-mix(in srgb, var(--tier, var(--accent)) 60%, transparent); color: var(--tier, var(--fg)); }
.count { text-align: right; font-family: var(--f-num); }
.count span { display: block; font-size: 11px; letter-spacing: .2em; color: var(--muted); }
.count strong { font-size: 22px; font-variant-numeric: tabular-nums; }
.hint { position: absolute; left: 14px; top: 78px; font-size: 12px; color: var(--muted); max-width: 260px; }
.presets { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; pointer-events: auto; width: max-content; max-width: calc(100% - 24px); }
.presets button { background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.presets button:hover { border-color: var(--fg); }
.presets .max { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.presets .gacha { border-color: var(--r-sr); color: var(--r-sr); }
.float { position: absolute; font-family: var(--f-num); font-weight: 700; font-size: 18px; pointer-events: none; transform: translate(-50%, -50%); text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: rise 1.3s ease-out forwards; white-space: nowrap; }
.float small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; text-align: center; opacity: .9; }
@keyframes rise { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -70px; } }
.banner { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%) scale(.6); text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s, transform .5s cubic-bezier(.2,1.6,.4,1); }
.banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.banner b { display: block; font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 5vw, 54px); color: var(--accent); text-shadow: 0 0 30px rgba(255,182,39,.7), 0 4px 0 #6a4300; letter-spacing: .08em; white-space: nowrap; }
.banner span { font-size: 15px; letter-spacing: .3em; color: var(--fg); }

/* ---------- right panel ---------- */
.tier { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 12px; align-items: center; }
.emblem { width: 64px; height: 72px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(160deg, var(--tier, var(--muted)), color-mix(in srgb, var(--tier, var(--muted)) 35%, var(--bg))); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; color: var(--bg); }
.tier-name { font-family: var(--f-display); font-size: 26px; line-height: 1.1; color: var(--tier, var(--fg)); }
.tier-sub { color: var(--muted); font-size: 12.5px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--tier, var(--accent)); transition: width .5s; }
.radar-wrap { display: grid; place-items: center; }
#radar { width: 100%; max-width: 320px; aspect-ratio: 32 / 25; }

.sample { display: flex; flex-direction: column; gap: 8px; }
.sample-frame { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #000; }
#sample { display: block; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; transition: filter .35s; }
#sample.dev { filter: brightness(1.8) blur(4px) saturate(0); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags span { font-size: 12px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; padding: 1px 7px; }
.tags span.hi { border-color: var(--accent); color: var(--accent); }
.deliv { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.deliv li { display: flex; gap: 8px; }
.deliv li::before { content: ""; width: 6px; height: 6px; margin-top: 7px; flex: none; background: var(--good); transform: rotate(45deg); }

.quote { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.qrow { display: flex; justify-content: space-between; gap: 10px; }
.qrow span:first-child { min-width: 0; color: var(--muted); }
.qrow span:last-child { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qrow.base span:first-child { color: var(--fg); }
.qrow.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-weight: 700; }
.qrow.total span:last-child { color: var(--accent); font-size: 20px; }
.qnote { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions button { border-radius: 8px; padding: 9px 10px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 500; }
.actions .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 30; }

.modal { position: fixed; inset: 0; z-index: 20; background: rgba(5,6,15,.82); display: grid; place-items: center; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; max-width: 460px; width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.modal-box img { width: 100%; border-radius: 6px; display: block; }
.modal-box p { margin: 0; color: var(--muted); font-size: 12.5px; }
.modal-box textarea { width: 100%; min-height: 220px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 12.5px/1.6 var(--f-body); resize: vertical; }

@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0,1fr); grid-template-rows: auto; height: auto; }
  .stage { height: min(66vh, 600px); min-height: 400px; order: 1; }
  .topbar { order: 0; }
  .panel.left { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .panel.right { order: 3; border-left: 0; border-top: 1px solid var(--line); }
  .panel { overflow: visible; }
  .panel-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hint { display: none; }
}
@media (max-width: 520px) {
  .brand h1 { font-size: 21px; }
  .top-total strong { font-size: 22px; }
  .power strong { font-size: 30px; }
  .presets button { padding: 5px 9px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .float { animation-duration: .01s; }
  .card, .banner, .bar i { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><b id="brandName">XIN STUDIO</b><h1>摄影师装备舱</h1></div>
    <div class="top-total"><span>当前配置报价</span><strong id="topTotal">¥0</strong></div>
  </header>

  <aside class="panel left" aria-label="装备库">
    <div class="panel-inner">
      <div class="sec-title"><h2>装备库</h2><small>点一下，装到摄影师身上</small></div>
      <div class="tabs" id="tabs" role="toolbar" aria-label="装备分类"></div>
      <div id="gearList" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="three" aria-label="3D 摄影师与装备"></canvas>
    <div class="hud" id="hud">
      <div class="hud-top">
        <div class="power"><span>战力 POWER</span><strong id="power">0</strong></div>
        <div class="count"><span>已装备</span><strong id="count">0 / 0</strong></div>
      </div>
      <div class="hint">拖动旋转视角，滚轮缩放。点击左下角的装备箱，随机开出一件装备。</div>
      <div class="banner" id="banner"><b>全副武装</b><span>人形移动摄影棚</span></div>
      <div class="presets" id="presets">
        <button type="button" data-preset="light">轻装出行</button>
        <button type="button" data-preset="pro">专业标配</button>
        <button type="button" data-preset="flag">旗舰全案</button>
        <button type="button" class="max" data-preset="max">一键满配</button>
        <button type="button" class="gacha" data-preset="gacha">开箱抽一件</button>
        <button type="button" data-preset="clear">卸下全部</button>
      </div>
    </div>
  </main>

  <aside class="panel right" aria-label="配置结果">
    <div class="panel-inner">
      <div class="tier" id="tierBox">
        <div class="emblem" id="emblem">空</div>
        <div style="min-width:0">
          <div class="eyebrow">摄影师段位</div>
          <div class="tier-name" id="tierName">空白模特</div>
          <div class="tier-sub" id="tierSub">还没带装备</div>
          <div class="bar"><i id="tierBar"></i></div>
        </div>
      </div>

      <div class="radar-wrap"><canvas id="radar" width="640" height="500" aria-label="六维能力图"></canvas></div>

      <section class="sample">
        <div class="sec-title"><h2>这套配置出的片子</h2><small>示意效果</small></div>
        <div class="sample-frame"><canvas id="sample" width="640" height="400" aria-label="样片示意"></canvas></div>
        <div class="tags" id="tags"></div>
      </section>

      <section style="display:flex;flex-direction:column;gap:8px">
        <div class="sec-title"><h2>你会拿到</h2></div>
        <ul class="deliv" id="deliv"></ul>
      </section>

      <section style="display:flex;flex-direction:column;gap:8px">
        <div class="sec-title"><h2>报价单</h2><small id="itemCount"></small></div>
        <div class="quote" id="quote"></div>
        <div class="actions">
          <button type="button" class="primary" id="posterBtn">生成战绩海报</button>
          <button type="button" id="copyBtn">复制报价单</button>
        </div>
      </section>
    </div>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sec-title"><h2 id="modalTitle">战绩海报</h2><button type="button" id="modalClose" class="tab">关闭</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   配置区：品牌、基础价、装备价格都在这里改
   ===================================================================== */
const BRAND = 'XIN STUDIO';
const BASE = { name: '摄影师基础出勤（半天 4 小时）', price: 2999 };
const RAR = { N: { label: '普通', color: '#9aa6bf' }, R: { label: '稀有', color: '#4fa3ff' }, SR: { label: '史诗', color: '#b77bff' }, SSR: { label: '传说', color: '#ffb627' } };
const STAT_KEYS = [['q', '画质'], ['l', '光影'], ['m', '氛围'], ['v', '动态'], ['a', '视角'], ['s', '服务']];
const CATS = [
  { id: 'body', name: '主力机身', note: '四选一' },
  { id: 'lens', name: '镜头群', note: '挂在腰带上' },
  { id: 'video', name: '视频机位', note: '' },
  { id: 'light', name: '灯光', note: '围在四周' },
  { id: 'aerial', name: '航拍', note: '头顶盘旋' },
  { id: 'support', name: '支撑收纳', note: '' },
  { id: 'team', name: '团队与服务', note: '' },
];

/* ---------- 3D helpers ---------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .45, metalness: .3, ...o });
const M = {
  dark: mat(0x1d2028, { metalness: .6, roughness: .35 }),
  black: mat(0x0d0e12, { metalness: .4, roughness: .5 }),
  grey: mat(0x5a6070, { metalness: .6 }),
  silver: mat(0xc9ced8, { metalness: .9, roughness: .25 }),
  white: mat(0xeceff3, { metalness: .1, roughness: .45 }),
  red: mat(0xd62828, { metalness: .3 }),
  orange: mat(0xff6a00, { emissive: 0x401800 }),
  gold: mat(0xffb627, { metalness: .85, roughness: .3 }),
  goldGlow: new THREE.MeshStandardMaterial({ color: 0xffb627, emissive: 0xffa000, emissiveIntensity: 1.6 }),
  glass: mat(0x1a3a5a, { metalness: .9, roughness: .05, emissive: 0x0a2a4a }),
  olive: mat(0x40472f, { metalness: .05, roughness: .9 }),
  fabric: mat(0x2b2f3a, { metalness: .05, roughness: .9 }),
  pink: mat(0xff8fb3, { metalness: .2 }),
};
function box(w, h, d, m, x = 0, y = 0, z = 0) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = true; return o; }
function cyl(rt, rb, h, m, seg = 24, open = false) { const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), m); o.castShadow = true; return o; }
function sph(r, m) { const o = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), m); o.castShadow = true; return o; }
function limb(a, b, r, m) {
  const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
  const o = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(.001, len), 6, 12), m);
  o.position.copy(a).addScaledVector(d, .5);
  o.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); o.castShadow = true; return o;
}
function grp(...c) { const g = new THREE.Group(); c.forEach(x => g.add(x)); return g; }
function at(o, x, y, z, rx = 0, ry = 0, rz = 0) { o.position.set(x, y, z); o.rotation.set(rx, ry, rz); return o; }

const live = new Map();

function updateItems(t, dt) {

      obj.rotation.set(r[0], r[1] + (1 - u) * Math.PI * 3, r[2]);
      if (u >= 1) {

      }
    } else if (it.state === 'idle') {
      if (def.orbit) {

      if (u >= 1) { it.parent.remove(obj); obj.traverse(o => { o.geometry?.dispose?.(); }); live.delete(id); }

  const v = c.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .65); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${.1 + mood * .5})`); c.fillStyle = v; c.fillRect(0, 0, W, H);
}
function tagList(S) {
  const t = [];
  t.push(S.q === 0 ? ['手机直出，噪点明显', 0] : S.q < 25 ? ['清晰可用', 0] : S.q < 50 ? ['通透细腻', 0] : S.q < 80 ? ['商业级高清', 1] : ['亿级像素，可做巨幅喷绘', 1]);
  t.push(S.l === 0 ? ['看天吃饭的自然光', 0] : S.l < 20 ? ['基础补光', 0] : S.l < 45 ? ['立体光影', 0] : ['杂志级布光', 1]);
  t.push(S.m < 10 ? ['记录感', 0] : S.m < 30 ? ['有氛围', 0] : S.m < 60 ? ['电影感', 1] : ['大片叙事感', 1]);
  if (sel.has('lens_85') || sel.has('lens_50')) t.push(['奶油虚化', 1]);
  if (sel.has('fog')) t.push(['丁达尔光', 1]);
  if (sel.has('grade')) t.push(['青橙电影色调', 0]);
  if (S.v >= 25) t.push([S.v >= 60 ? '电影级动态影像' : '视频花絮', 1]);
  if (S.a >= 25) t.push(['航拍视角', 1]);
  return t;
}
function renderTags(S) { $('tags').innerHTML = tagList(S).map(([s, hi]) => `<span class="${hi ? 'hi' : ''}">${s}</span>`).join(''); }
function deliverables(S) {
  const d = ['全部底片', sel.has('grade') ? '精选 60 张，统一电影级调色' : '精选 20 张基础调色'];
  if (sel.has('retouch')) d.push('精修 30 张，保留皮肤质感');
  if (sel.has('cine_red')) d.push('8K 电影级 MV 一支（3–5 分钟）');
  else if (sel.has('cine_fx3')) d.push('4K 花絮短片一支（3 分钟）');
  if (S.a >= 25) d.push('航拍素材与成片镜头');
  if (sel.has('mua')) d.push('全程跟妆、换造型');
  if (sel.has('director')) d.push('拍摄前策划方案与分镜脚本');
  d.push(sel.has('rush') ? '24 小时出初选，3 天出精修' : '7 天出初选，15 天出精修');
  return d;
}
function renderDeliverables(S) { $('deliv').innerHTML = deliverables(S).map(x => `<li>${x}</li>`).join(''); }

/* ---------- poster + copy ---------- */
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
function openModal(title, node) { $('modalTitle').textContent = title; const b = $('modalBody'); b.innerHTML = ''; b.append(...node); $('modal').hidden = false; }
$('modalClose').onclick = () => $('modal').hidden = true;
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') $('modal').hidden = true; });
$('copyBtn').onclick = () => {
  const txt = quoteText();
  navigator.clipboard?.writeText(txt).then(() => toast('报价单已复制'), () => showText(txt)) ?? showText(txt);
};
function showText(txt) { const ta = document.createElement('textarea'); ta.id = 'quoteText'; ta.value = txt; ta.readOnly = true; const p = document.createElement('p'); p.textContent = '复制没有成功，请手动全选下面的文字复制。'; openModal('报价单', [p, ta]); ta.select(); }
$('posterBtn').onclick = () => {
  const P = document.createElement('canvas'); P.width = 1080; P.height = 1500; const x = P.getContext('2d');
  const tc = getComputedStyle(document.documentElement).getPropertyValue('--tier').trim() || '#ffb627';
  const bg = x.createLinearGradient(0, 0, 0, 1500); bg.addColorStop(0, '#1a1e4a'); bg.addColorStop(1, '#07080f'); x.fillStyle = bg; x.fillRect(0, 0, 1080, 1500);
  renderer.render(scene, cam);
  const src = renderer.domElement, sw = src.width, sh = src.height, ar = 1080 / 860;
  let cw = sw, ch = sw / ar; if (ch > sh) { ch = sh; cw = sh * ar; }
  x.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 120, 1080, 860);
  x.fillStyle = '#ffb627'; x.font = '700 30px "Chakra Petch", monospace'; x.fillText(BRAND, 60, 72);
  x.fillStyle = '#eceaf7'; x.font = '44px "ZCOOL QingKe HuangYou", sans-serif'; x.textAlign = 'right'; x.fillText('摄影师装备舱', 1020, 76); x.textAlign = 'left';
  const g2 = x.createLinearGradient(0, 760, 0, 980); g2.addColorStop(0, 'rgba(7,8,15,0)'); g2.addColorStop(1, 'rgba(7,8,15,1)'); x.fillStyle = g2; x.fillRect(0, 760, 1080, 220);
  x.fillStyle = tc; x.font = '96px "ZCOOL QingKe HuangYou", sans-serif'; x.fillText($('tierName').textContent, 60, 960);
  x.fillStyle = '#8d91b8'; x.font = '30px "Noto Sans SC", sans-serif'; x.fillText($('tierSub').textContent, 64, 1010);
  x.fillStyle = '#eceaf7'; x.font = '700 64px "Chakra Petch", monospace'; x.textAlign = 'right'; x.fillText('战力 ' + (statSum(stats()) * 10).toLocaleString('zh-CN'), 1020, 960);
  x.fillStyle = '#ffb627'; x.font = '700 44px "Chakra Petch", monospace'; x.fillText(yuan(total()), 1020, 1012); x.textAlign = 'left';
  x.drawImage($('sample'), 60, 1060, 480, 300);
  x.strokeStyle = '#262b52'; x.lineWidth = 2; x.strokeRect(60, 1060, 480, 300);
  x.fillStyle = '#eceaf7'; x.font = '500 26px "Noto Sans SC", sans-serif';
  const names = [...sel].map(id => GEAR_BY[id].name); let yy = 1080;
  x.fillStyle = '#8d91b8'; x.font = '24px "Noto Sans SC", sans-serif'; x.fillText(`已装备 ${names.length} 件`, 580, yy + 10); yy += 48;
  x.fillStyle = '#eceaf7'; x.font = '24px "Noto Sans SC", sans-serif';
  names.slice(0, 9).forEach(n => { x.fillText('· ' + n, 580, yy); yy += 34; }); if (names.length > 9) x.fillText(`… 等 ${names.length} 件`, 580, yy);
  x.fillStyle = '#8d91b8'; x.font = '24px "Noto Sans SC", sans-serif'; x.fillText('按配置出片 · 所见即所得', 60, 1440);
  const img = new Image(); img.src = P.toDataURL('image/png'); img.alt = '战绩海报';
  const p = document.createElement('p'); p.textContent = '长按图片（手机）或右键「图片另存为」（电脑）即可保存，发给客户或发朋友圈。';
  openModal('战绩海报', [img, p]);
};

/* ---------- boot ---------- */
$('brandName').textContent = BRAND;
renderTabs(); renderList();
function start(data = {}) {
  window.__thumbs = makeThumbs(); renderList(window.__thumbs);
  update(); tick(); loop();
  const init = Array.isArray(data.sel) ? data.sel.filter(id => GEAR_BY[id]) : PRESETS.pro;
  setTimeout(() => applySet(init), 500);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
